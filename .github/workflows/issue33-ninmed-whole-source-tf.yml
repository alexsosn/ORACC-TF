name: issue33-ninmed-whole-source-tf

on:
  pull_request:
    branches: [main]
    paths:
      - "programs/oracc_tf/ninmed.py"
      - "programs/oracc_tf/corpus.py"
      - "tests/acceptance/ninmed_all_sources_gate.py"
      - ".github/workflows/issue33-ninmed-whole-source-tf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whole-native-source-to-tf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native converter with TF
        run: python -m pip install -e ".[dev]" "text-fabric==13.1.0"
      - name: Convert all 159 real source bodies and validate TF and resource use
        run: /usr/bin/time -v python -m pytest -q -s tests/acceptance/ninmed_all_sources_gate.py
