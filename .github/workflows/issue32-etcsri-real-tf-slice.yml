name: issue32-etcsri-real-tf-slice

on:
  pull_request:
    paths:
      - "programs/oracc_tf/etcsri.py"
      - "programs/oracc_tf/gdl.py"
      - "programs/oracc_tf/loader.py"
      - "tests/test_issue32_etcsri_vertical_slice.py"
      - "tests/test_issue32_etcsri_missing_spans.py"
      - "tests/test_issue32_etcsri_nonword.py"
      - "docs/plans/P-007-etcsri-real-tf-slice.md"
      - ".github/workflows/issue32-etcsri-real-tf-slice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-to-tf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pyproject.toml
            programs/oracc_tf
            tests/conftest.py
            tests/test_issue32_etcsri_vertical_slice.py
            tests/test_issue32_etcsri_missing_spans.py
            tests/test_issue32_etcsri_nonword.py
            data/etcsri/corpusjson
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual Text-Fabric runtime and test dependencies
        run: python -m pip install -e ".[dev]" "text-fabric==13.1.0"
      - name: Survey rare nonw CDL records from actual ETCSRI sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          examples = []
          for path in sorted(Path("data/etcsri/corpusjson").glob("*.json")):
              root = json.loads(path.read_text(encoding="utf-8"))
              todo = [(root, "root")]
              while todo:
                  node, parent = todo.pop()
                  if node.get("node") == "d" and node.get("type") == "nonw":
                      examples.append({
                          "member": path.name,
                          "parent": parent,
                          "marker": node,
                      })
                  for child in node.get("cdl") or []:
                      if isinstance(child, dict):
                          todo.append((child, node.get("id") or node.get("ref") or "document"))
          print("ETCSRI nonw source witnesses:", json.dumps(examples, ensure_ascii=False, sort_keys=True))
          if len(examples) != 2:
              raise AssertionError(f"Expected the two R-007 nonw markers; observed {len(examples)}")
          PY
      - name: Convert both real ETCSRI witnesses and verify source data in Text-Fabric
        run: python -m pytest -vv -m corpus tests/test_issue32_etcsri_vertical_slice.py
      - name: Validate actual Q000377 missing-line markers as technical TF gaps
        run: python -m pytest -vv -m corpus tests/test_issue32_etcsri_missing_spans.py
      - name: Verify two real nonw markers in their source sentences
        run: |
          python -m pytest -vv -m corpus tests/test_issue32_etcsri_nonword.py
          python -m pytest -vv -m "not corpus" tests/test_issue32_etcsri_nonword.py
      - name: Run negative unknown-shape and absent-morphology regressions
        run: python -m pytest -vv -m "not corpus" tests/test_issue32_etcsri_vertical_slice.py
