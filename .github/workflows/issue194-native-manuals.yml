name: issue194-native-manuals

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/native/**"
      - "tests/test_issue194_native_manuals.py"
      - ".github/workflows/issue194-native-manuals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-manuals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify user manuals against actual native ORACC JSON witnesses
        run: python -m pytest -q tests/test_issue194_native_manuals.py
