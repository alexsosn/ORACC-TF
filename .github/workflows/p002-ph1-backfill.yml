name: p002-ph1-backfill

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backfill:
    if: github.head_ref == 'codex/p002-ph1-upstream-lock'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Generate lock and snapshot diff
        run: |
          if [ -f upstream.lock.json ]; then
            echo "Committed lock already present; live bootstrap not repeated."
            mkdir -p backfill-output
            cp upstream.lock.json backfill-output/upstream.lock.json
            if [ -f docs/reports/P-002-PH1-upstream-backfill.json ]; then
              cp docs/reports/P-002-PH1-upstream-backfill.json backfill-output/upstream-backfill-report.json
            fi
          else
            python scripts/backfill_upstream_lock.py --output-dir backfill-output
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: p002-ph1-backfill
          path: backfill-output/
          if-no-files-found: error
          retention-days: 7
