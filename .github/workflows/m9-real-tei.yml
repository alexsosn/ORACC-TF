name: m9-real-tei

on:
  pull_request:
    paths:
      - ".github/workflows/m9-real-tei.yml"
      - "programs/oracc_tf/**"
      - "tests/test_m9_real_tei_integration.py"
      - "tests/test_m9_translation_archive.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-tei:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ORACC-TF
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Fetch published RIAO TEI archive with normal TLS verification
        run: |
          mkdir -p .external
          curl --fail --location --retry 2 --retry-delay 2 \
            --proto '=https' --tlsv1.2 \
            --output .external/riao-teiCorpus-20241202.zip \
            https://oracc.museum.upenn.edu/riao/downloads/riao-teiCorpus-20241202.zip
          sha256sum .external/riao-teiCorpus-20241202.zip
          unzip -t .external/riao-teiCorpus-20241202.zip >/dev/null

      - name: Validate real TEI source characterization
        env:
          ORACC_TRANSLATION_TEI_ZIP: .external/riao-teiCorpus-20241202.zip
        run: pytest -q tests/test_m9_real_tei_integration.py
